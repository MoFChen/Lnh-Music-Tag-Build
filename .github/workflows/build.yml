name: Build Lnh-Music-Tag

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '上游分支、Tag 或 Commit'
        required: false
        default: 'main'

  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v6
        with:
          repository: lahuolou/Lnh-Music-Tag
          ref: ${{ inputs.ref || 'main' }}
          path: source
          persist-credentials: false

      - name: 获取版本信息
        id: meta
        working-directory: source
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: 构建前端
        working-directory: source/web
        run: |
          npm ci
          npm run build

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: 下载 Go 依赖
        working-directory: source
        run: go mod download

      - name: 交叉编译
        working-directory: source
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist

          for target in linux/amd64 linux/arm64 \
                        windows/amd64 windows/arm64 \
                        darwin/amd64 darwin/arm64
          do
            export GOOS="${target%/*}"
            export GOARCH="${target#*/}"

            filename="lnh-music-tag-${GOOS}-${GOARCH}"

            if [ "$GOOS" = "windows" ]; then
              filename="${filename}.exe"
            fi

            go build -trimpath \
              -ldflags="-s -w" \
              -o "../dist/${filename}" .
          done

          cp LICENSE ../dist/
          git rev-parse HEAD > ../dist/COMMIT
          cp VERSION ../dist/

      - name: 生成 SHA256 校验文件
        working-directory: dist
        run: sha256sum lnh-music-tag-* > SHA256SUMS

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: lnh-music-tag-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
